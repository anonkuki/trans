spring:
  application:
    name: ai-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
    allow-bean-definition-overriding: true # 允许 Bean 覆盖，例如说 Feign 等会存在重复定义的服务

  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # 加载【本地】配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置

  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: ${TRANSDOC_MAX_FILE_SIZE:50MB} # 与内部 OCR 接口默认上限保持一致
      max-request-size: ${TRANSDOC_MAX_REQUEST_SIZE:55MB}

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 LocalDateTime 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 设置过期时间为 1 小时

server:
  port: 48090
  servlet:
    encoding:
      enabled: true
      charset: UTF-8 # 必须设置 UTF-8，避免 WebFlux 流式返回（AI 场景）会乱码问题
      force: true

logging:
  file:
    name: ./logs/${spring.application.name}.log # 日志文件名，全路径

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true # 1. 是否开启 Swagger 接文档的元数据
    path: /v3/api-docs
  swagger-ui:
    enabled: true # 2.1 是否开启 Swagger 文档的官方 UI 界面
    path: /swagger-ui
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档

knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis Plus 的配置项
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
    cache-enabled: false # 全局禁用 MyBatis 二级缓存
  global-config:
    db-config:
      id-type: NONE # "智能"模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
      #      id-type: AUTO # 自增 ID，适合 MySQL 等直接自增的数据库
      #      id-type: INPUT # 用户输入 ID，适合 Oracle、PostgreSQL、Kingbase、DB2、H2 数据库
      #      id-type: ASSIGN_ID # 分配 ID，默认使用雪花算法。注意，Oracle、PostgreSQL、Kingbase、DB2、H2 数据库时，需要去除实体类上的 @KeySequence 注解
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${sva.info.base-package}.module.*.dal.dataobject
  encryptor:
    password: ${SVA_CONFIG_PASSWORD:} # 加解密的秘钥，可使用 https://www.imaegoo.com/2020/aes-key-generator/ 网站生成

mybatis-plus-join:
  banner: false # 关闭控制台的 Banner 打印

# VO 转换（数据翻译）相关
easy-trans:
  is-enable-global: false # 【默认禁用，对性能确认压力大】启用全局翻译（拦截所有 SpringMVC ResponseBody 进行自动翻译 )。如果对于性能要求很高可关闭此配置，或通过 @IgnoreTrans 忽略某个接口

--- #################### RPC 远程调用相关配置 ####################

--- #################### MQ 消息队列相关配置 ####################

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    executor:
      appname: ${spring.application.name} # 执行器 AppName
      logpath: ${user.home}/logs/xxl-job/${spring.application.name} # 执行器运行日志文件存储磁盘路径
    accessToken: default_token # 执行器通讯TOKEN

--- #################### AI 相关配置 ####################

spring:
  ai:
    vectorstore: # 向量存储
      redis:
        initialize-schema: true
        index-name: knowledge_index # Redis 中向量索引的名称：用于存储和检索向量数据的索引标识符，所有相关的向量搜索操作都会基于这个索引进行
        prefix: "knowledge_segment:" # Redis 中存储向量数据的键名前缀：这个前缀会添加到每个存储在 Redis 中的向量数据键名前，每个 document 都是一个 hash 结构
      qdrant:
        initialize-schema: true
        collection-name: knowledge_segment # Qdrant 中向量集合的名称：用于存储向量数据的集合标识符，所有相关的向量操作都会在这个集合中进行
        host: 127.0.0.1
        port: 6334
      milvus:
        initialize-schema: true
        database-name: default # Milvus 中数据库的名称
        collection-name: knowledge_segment # Milvus 中集合的名称：用于存储向量数据的集合标识符，所有相关的向量操作都会在这个集合中进行
        client:
          host: 127.0.0.1
          port: 19530
    qianfan: # 文心一言
      api-key: ${SVA_CONFIG_SECRET:}
      secret-key: ${SVA_CONFIG_SECRET:}
    zhipuai: # 智谱 AI
      api-key: ${SVA_CONFIG_SECRET:}
    openai: # OpenAI 兼容模式（阿里云 DashScope）
      api-key: ${SVA_CONFIG_SECRET:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: deepseek-v3
          temperature: 0.2
    azure: # OpenAI 微软
      openai:
        endpoint: https://eastusprejade.openai.azure.com
    anthropic: # Anthropic Claude
      api-key: ${SVA_CONFIG_SECRET:}
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        model: llama3
    stabilityai:
      api-key: ${SVA_CONFIG_SECRET:}
    dashscope: # 通义千问
      api-key: ${QWEN_API_KEY:}
      chat:
        options:
          model: ${QWEN_MODEL:qwen3.8-flash}
    minimax: # Minimax：https://www.minimaxi.com/
      api-key: ${SVA_CONFIG_SECRET:}
    moonshot: # 月之暗面（KIMI）
      api-key: ${SVA_CONFIG_SECRET:}
    deepseek: # DeepSeek
      api-key: ${SVA_CONFIG_SECRET:}
      chat:
        options:
          model: deepseek-chat
    model:
      rerank: false # 是否开启“通义千问”的 Rerank 模型，填写 dashscope 开启
    mcp:
      server:
        enabled: false
        name: sva-mcp-server
        version: 1.0.0
        instructions: 一个 MCP 示例服务
        sse-endpoint: /sse
      client:
        enabled: false
        name: mcp
        sse:
          connections:
            filesystem:
              url: http://127.0.0.1:8089
              sse-endpoint: /sse
        annotation-scanner:
          enabled: false # TODO @芋艿：有 bug https://github.com/spring-projects/spring-ai/issues/4917 需要官方修复

sva:
  ai:
    gemini: # 谷歌 Gemini
      enable: true
      api-key: ${SVA_CONFIG_SECRET:}
      model: gemini-2.5-flash
    doubao: # 字节豆包
      enable: true
      api-key: ${SVA_CONFIG_SECRET:}
      model: doubao-1-5-lite-32k-250115
    hunyuan: # 腾讯混元
      enable: true
      api-key: ${SVA_CONFIG_SECRET:}
      model: hunyuan-turbo
    siliconflow: # 硅基流动
      enable: true
      api-key: ${SVA_CONFIG_SECRET:}
      model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    xinghuo: # 讯飞星火
      enable: true
      appKey: ${SVA_CONFIG_SECRET:}
      secretKey: ${SVA_CONFIG_SECRET:}
      model: x1
    baichuan: # 百川智能
      enable: true
      api-key: ${SVA_CONFIG_SECRET:}
      model: Baichuan4-Turbo
    midjourney:
      enable: true
  #    base-url: https://api.holdai.top/mj-relax/mj
      base-url: https://api.holdai.top/mj
      api-key: ${SVA_CONFIG_SECRET:}
      notify-url: http://java.nat300.top/admin-api/ai/image/midjourney/notify
    suno:
      enable: true
  #    base-url: https://suno-55ishh05u-status2xxs-projects.vercel.app
      base-url: http://127.0.0.1:3001
    web-search:
      enable: true
      api-key: ${SVA_CONFIG_SECRET:}

--- #################### 科兴相关配置 ####################

transdoc:
  pdf-convert-mode: ${TRANSDOC_PDF_CONVERT_MODE:1}
  python-recognize-url: ${TRANSDOC_PYTHON_RECOGNIZE_URL:http://127.0.0.1:8030/internal/v1/ocr/recognize}
  python-internal-token: ${TRANSDOC_PYTHON_INTERNAL_TOKEN:}
  python-connect-timeout: ${TRANSDOC_PYTHON_CONNECT_TIMEOUT:10s}
  python-read-timeout: ${TRANSDOC_PYTHON_READ_TIMEOUT:31m}
  temp-dir: ${TRANSDOC_TEMP_DIR:D:/Temp/trans-platform}

sva:
  info:
    version: 1.0.0
    base-package: cn.iocoder.sva.module.ai
  web:
    admin-ui:
      url: http://dashboard.sva.iocoder.cn # Admin 管理后台 UI 的地址
  xss:
    enable: false
    exclude-urls: # 如下 url，仅仅是为了演示，去掉配置也没关系
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  swagger:
    title: 管理后台
    description: 提供管理员管理的所有功能
    version: ${sva.info.version}
  tenant: # 多租户相关配置项
    enable: false

debug: false
